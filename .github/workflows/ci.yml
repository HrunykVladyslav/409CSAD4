name: Rust CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI script on Windows
        if: runner.os == 'Windows'
        run: .\ci.bat

      - name: Run CI script on Linux and macOS
        if: runner.os != 'Windows'
        run: bash ./ci.sh
